name: Cleanup images

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Report only, delete nothing'
        type: boolean
        default: true

concurrency:
  group: cleanup-images

jobs:
  # Ephemeral PR image, removed when the PR closes either way.
  pr-tag:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-tags: pr-${{ github.event.pull_request.number }}
          log-level: debug

  # Ages out sha-only images. Any version carrying a release tag is
  # excluded outright, so release images and their sha tags are never
  # touched. exclude-tags takes priority over every other rule.
  sha-tags:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-tags: '^sha-[0-9a-f]+$'
          exclude-tags: '^(latest|v?[0-9]+(\.[0-9]+)*)$'
          use-regex: true
          older-than: 30 days
          log-level: debug
          dry-run: ${{ inputs.dry-run || false }}

  # Orphaned digests, mostly from pr-N tags moving as a PR iterates.
  untagged:
    needs: sha-tags
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-untagged: true
          exclude-tags: '^(latest|v?[0-9]+(\.[0-9]+)*)$'
          use-regex: true
          log-level: debug
          dry-run: ${{ inputs.dry-run || false }}
